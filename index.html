<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inference GPU Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1e1e1e; 
            color: white; 
            max-width: 900px;
            margin: 0 auto;
        }
        .gpu-card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .gpu-card h3 {
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: #ddd;
        }
        .stat-box { margin-bottom: 15px; }
        .label { font-size: 16px; font-weight: bold; }
        .number { font-size: 20px; font-weight: bold; float: right; }
        .gpu-color { color: #4ade80; }
        .vram-color { color: #60a5fa; }
        
        progress { width: 100%; height: 18px; margin-top: 10px; }
        progress::-webkit-progress-bar { background-color: #444; border-radius: 5px; }

        /* Note: Progress values are styled dynamically in JS to allow multiple IDs */

        .chart-container {
            margin-top: 20px;
            background: #222;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>Local Multi-GPU Inference Status</h2>
    
    <!-- JavaScript will dynamically insert GPU blocks into this container -->
    <div id="gpu-container">
        <p>Connecting to C backend...</p>
    </div>

    <script>
        const maxDataPoints = 60; // Keep 60 seconds of history
        let isInitialized = false;
        const charts = {}; // Dictionary to hold Chart instances by GPU ID

        // Builds the UI dynamically based on how many GPUs are detected
        function buildUI(gpuArray) {
            const container = document.getElementById('gpu-container');
            container.innerHTML = ''; // Clear loading text

            if (gpuArray.length === 0) {
                container.innerHTML = '<p>No GPUs detected by the C program.</p>';
                return;
            }

            gpuArray.forEach(gpu => {
                // 1. Generate the HTML structure for this GPU
                const card = document.createElement('div');
                card.className = 'gpu-card';
                card.innerHTML = `
                    <h3>GPU ${gpu.id}</h3>
                    
                    <div class="stat-box">
                        <span class="label">Compute Utilization</span>
                        <span class="number gpu-color" id="gpu-num-${gpu.id}">0%</span>
                        <progress id="gpu-bar-${gpu.id}" value="0" max="100"></progress>
                    </div>

                    <div class="stat-box">
                        <span class="label">VRAM Usage</span>
                        <span class="number vram-color" id="vram-num-${gpu.id}">0%</span>
                        <progress id="vram-bar-${gpu.id}" value="0" max="100"></progress>
                    </div>

                    <div class="chart-container">
                        <canvas id="chart-${gpu.id}" width="400" height="120"></canvas>
                    </div>
                `;
                container.appendChild(card);

                // Dynamically apply colors to the progress bars
                document.getElementById(`gpu-bar-${gpu.id}`).style.accentColor = '#4ade80';
                document.getElementById(`vram-bar-${gpu.id}`).style.accentColor = '#60a5fa';

                // 2. Initialize Chart.js for this specific GPU
                const ctx = document.getElementById(`chart-${gpu.id}`).getContext('2d');
                charts[gpu.id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array(maxDataPoints).fill(''),
                        datasets: [
                            {
                                label: 'Compute (%)',
                                borderColor: '#4ade80',
                                backgroundColor: 'rgba(74, 222, 128, 0.1)',
                                data: Array(maxDataPoints).fill(0),
                                fill: true, tension: 0.3, pointRadius: 0
                            },
                            {
                                label: 'VRAM (%)',
                                borderColor: '#60a5fa',
                                backgroundColor: 'rgba(96, 165, 250, 0.1)',
                                data: Array(maxDataPoints).fill(0),
                                fill: true, tension: 0.3, pointRadius: 0
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        animation: false,
                        scales: {
                            y: { min: 0, max: 100, grid: { color: '#444' }, ticks: { color: '#aaa' } },
                            x: { grid: { display: false } }
                        },
                        plugins: { legend: { labels: { color: 'white' } } }
                    }
                });
            });

            isInitialized = true;
        }

        // Fetches data and updates UI
        async function fetchGpuStats() {
            try {
                const response = await fetch('/stats');
                const gpuArray = await response.json(); // Now expects an array!
                
                // If it's our first time, or if the number of GPUs changed, rebuild the UI
                if (!isInitialized || Object.keys(charts).length !== gpuArray.length) {
                    buildUI(gpuArray);
                }

                // Update the stats for every GPU found
                gpuArray.forEach(gpu => {
                    // Update Text
                    document.getElementById(`gpu-num-${gpu.id}`).innerText = gpu.gpu_percent + '%';
                    document.getElementById(`vram-num-${gpu.id}`).innerText = gpu.vram_percent + '%';

                    // Update Bars
                    document.getElementById(`gpu-bar-${gpu.id}`).value = gpu.gpu_percent;
                    document.getElementById(`vram-bar-${gpu.id}`).value = gpu.vram_percent;

                    // Update Line Charts
                    const chart = charts[gpu.id];
                    const gpuDataset = chart.data.datasets[0].data;
                    const vramDataset = chart.data.datasets[1].data;

                    gpuDataset.shift(); // Remove oldest
                    gpuDataset.push(gpu.gpu_percent); // Add newest

                    vramDataset.shift(); 
                    vramDataset.push(gpu.vram_percent);

                    chart.update(); // Tell Chart.js to redraw
                });

            } catch (error) {
                console.error("Could not reach the C backend API", error);
            }
        }

        // Poll every 1 second
        setInterval(fetchGpuStats, 1000);
        fetchGpuStats(); // Initial call
    </script>
</body>
</html>
